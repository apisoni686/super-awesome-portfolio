<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✨🌮✨</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body class="main-page">
    <div class="main-section" id="text-element">
      <div class="heading-element" id="heading-element">
        <h1 class="title" id="recipe-title">Dinner at your fingertips.</h1>
        <p id="recipe-bulk">
          Take the work out of figuring out what to make for dinner. Search for
          any cuisine that comes to mind from gluten-free, to kid-friendly, to
          dessert. You name it, we got it.
        </p>
        <div id="home-container">
          <a
            href="https://super-awesome-recipe-generator.netlify.app"
            class="home-button-1"
            id="home-button"
            >Home</a
          >
        </div>
        <form id="recipe-generator-form">
          <input
            class="type"
            type="text"
            placeholder="Enter a cuisine..."
            autofocus
            required
            autocomplete="off"
            class="instructions"
            id="user-instructions"
          />
          <input type="submit" class="form-button" id="form-button" />
        </form>
      </div>
      <div class="photo" id="skillet">
        <img id="image" src="src/skillet1.jpg" height="650px" />
      </div>
    </div>
    <footer>
      This AI project was coded by
      <a href="https://www.linkedin.com/in/amy-pisoni-11907453/" target="_blank"
        >Amy Pisoni</a
      >, is on
      <a
        href="https://github.com/apisoni686?tab=overview&from=2024-05-01&to=2024-05-31"
        target="_blank"
        >GitHub</a
      >, and hosted on
      <a href="https://app.netlify.com/teams/apisoni686/sites" target="_blank"
        >Netlify</a
      >.
    </footer>
    <script src="index.js"></script>
  </body>
</html>
